version: 2

project_name: emhcl

before:
  hooks:
    # Builds web/playground/emhcl.wasm and copies the wasm_exec.js of the
    # same Go toolchain. Both are attached to the release below.
    - make build-wasm

builds:
  - id: emhcl
    main: ./cmd/emhcl
    binary: emhcl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.buildVersion={{ .Tag }}

archives:
  - id: default
    ids:
      - emhcl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: web/playground/emhcl.wasm
    - glob: web/playground/wasm_exec.js

changelog:
  disable: true

release:
  github:
    owner: event-modeling-hcl
    name: eventmodeling-hcl
  extra_files:
    - glob: web/playground/emhcl.wasm
    - glob: web/playground/wasm_exec.js
